# ==================== 自定义配置示例 (明文密码, 仅测试/开发) ====================
# 复制并按实际环境修改, 部署时用 -f values-custom.yaml 覆盖默认值
# 注意: 此文件含明文密码, 生产环境请改用 values-production.yaml (existingSecret 方式)

replicaCount: 2

image:
  repository: iflyelf/jumpbox
  tag: "latest"

# ==================== 数据库连接 (填入实际集群地址) ====================
databases:
  mysql:
    enabled: true
    # Percona Server MySQL 8.4 集群地址 (示例)
    host: "mysql-cluster-haproxy.database.svc.cluster.local"
    port: 3306
    auth:
      username: root
      password: "changeme-mysql-password"
    datadir: /data/mysql/data
  postgres:
    enabled: true
    # PostgreSQL 18 集群地址 (示例)
    host: "pg-cluster-primary.database.svc.cluster.local"
    port: 5432
    auth:
      username: postgres
      password: "changeme-pg-password"
      database: postgres
    datadir: /data/postgres/data
    pgbackrestStanza: db
  redis:
    enabled: true
    # Redis 8.2 集群地址 (示例)
    host: "redis-cluster.database.svc.cluster.local"
    port: 6379
    auth:
      password: "changeme-redis-password"
    datadir: /data/redis/data

# ==================== 定时备份 ====================
backup:
  enabled: true
  mode: logical          # logical / physical / both
  schedule: "0 2 * * *"  # 每天凌晨 2 点
  retentionDays: 7
  targetPath: /data/backups
  timeZone: "Asia/Shanghai"

# ==================== 宿主机挂载 ====================
extraHostVolumeMounts:
  - name: host-data
    hostPath: /data
    mountPath: /data
    type: DirectoryOrCreate
    readOnly: false
  - name: host-logs
    hostPath: /var/log
    mountPath: /host/var/log
    type: DirectoryOrCreate
    readOnly: true

# ==================== 持久化 ====================
persistence:
  enabled: true
  type: hostPath
  hostPath: /data
  size: 100Gi
