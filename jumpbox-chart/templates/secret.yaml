{{- /* 执行凭证校验 */ -}}
{{- include "jumpbox.validateCredentials" . -}}
{{- /* 仅当需要生成内部 Secret 时创建此资源 */ -}}
{{- if include "jumpbox.createInternalSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jumpbox.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "jumpbox.labels" . | nindent 4 }}
  annotations:
    # 警告: 此 Secret 包含明文密码, 生产环境建议使用 existingSecret 方式
    meta.helm.sh/password-source: "values.yaml"
type: Opaque
stringData:
  {{- $mysql := .Values.databases.mysql }}
  {{- $pg := .Values.databases.postgres }}
  {{- $redis := .Values.databases.redis }}
  {{- if and $mysql.enabled (not $mysql.existingSecret) }}
  mysql-password: {{ $mysql.auth.password | quote }}
  {{- end }}
  {{- if and $pg.enabled (not $pg.existingSecret) }}
  postgres-password: {{ $pg.auth.password | quote }}
  {{- end }}
  {{- if and $redis.enabled (not $redis.existingSecret) }}
  redis-password: {{ $redis.auth.password | quote }}
  {{- end }}
{{- end }}
